  <!-- Instant Route Restoration (Prevents Flash of Wrong Page) -->
  <script>
    (function () {
      var allowed = ['home', 'profile', 'seller', 'admin', 'product', 'store'];
      var rawHash = String(window.location.hash || '').replace(/^#/, '');
      var parts = rawHash.split('/');
      var hashView = parts[0] || '';
      var fromStorage = '';
      var decodeRouteId = function (val) {
        try { return decodeURIComponent(val); } catch (e) { return val; }
      };
      var listingType = hashView === 'product' && ['job', 'real_estate'].includes(parts[1]) ? parts[1] : '';
      var listingId = listingType ? decodeRouteId(parts[2] || '') : '';
      var productId = hashView === 'product' && !listingType ? decodeRouteId(parts.slice(1).join('/')) : '';
      var storeId = hashView === 'store' ? decodeRouteId(parts.slice(1).join('/')) : '';

      try {
        fromStorage = sessionStorage.getItem('ecomstore.activeView') || '';
        if (!listingType && !productId && (hashView === 'product' || fromStorage === 'product')) {
          var storedListingType = sessionStorage.getItem('ecomstore.currentListingType') || '';
          var storedListingId = sessionStorage.getItem('ecomstore.currentListingId') || '';
          if (['job', 'real_estate'].includes(storedListingType) && storedListingId) {
            listingType = storedListingType;
            listingId = storedListingId;
          } else {
            productId = sessionStorage.getItem('ecomstore.currentProductId') || '';
          }
        }
        if (!storeId && (hashView === 'store' || fromStorage === 'store')) {
          storeId = sessionStorage.getItem('ecomstore.currentStoreId') || '';
        }
      } catch (e) {}

      var initial = allowed.includes(hashView) ? hashView : (allowed.includes(fromStorage) ? fromStorage : 'home');
      if (initial === 'product' && !productId && !(listingType && listingId)) initial = 'home';
      if (initial === 'store' && !storeId) initial = 'home';

      document.documentElement.dataset.initialView = initial;
      document.documentElement.dataset.initialProductId = productId;
      document.documentElement.dataset.initialListingType = listingType;
      document.documentElement.dataset.initialListingId = listingId;
      document.documentElement.dataset.initialStoreId = storeId;
      document.documentElement.classList.add('route-restoring');
    })();
  </script>
  <style>
    html.route-restoring,
    html.route-restoring body {
      background: radial-gradient(circle at 50% 0%, #2A475E 0%, #1B2838 55%, #171A21 100%);
      margin: 0;
    }

    html.route-restoring .view,
    html.route-restoring footer,
    html.route-restoring .mobile-market-nav {
      display: none;
    }

    html.route-restoring body::before {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      width: 80px;
      height: 80px;
      margin: -40px 0 0 -40px;
      padding: 10px;
      box-sizing: border-box;
      border-radius: 50%;
      background: repeating-conic-gradient(
        #0000 0 5%,
        #1A9FFF 10%,
        #66C0F4 16%,
        #0000 22% 50%
      );
      -webkit-mask: conic-gradient(#000 0 0) content-box exclude, conic-gradient(#000 0 0);
      mask: conic-gradient(#000 0 0) content-box exclude, conic-gradient(#000 0 0);
      filter: blur(8px);
      z-index: 99999;
      pointer-events: none;
      animation: l2 1.5s linear infinite;
    }

    html.route-restoring body::after {
      content: "កំពុងផ្ទុកទំនិញ...";
      position: fixed;
      top: 50%;
      left: 50%;
      margin-top: 45px;
      transform: translateX(-50%);
      color: #9FB2C3;
      font-family: 'Kantumruy Pro', sans-serif;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      z-index: 99999;
      pointer-events: none;
    }

    @keyframes l2 {
      to {
        rotate: 1turn;
      }
    }
  </style>
</head>

<body class="font-khmer">

        </span>

        </span>

          <option value="fashion">សម្លៀកបំពាក់</option>

        </select>
        <span class="hidden h-5 w-px bg-slate-200 sm:block"></span>
        <span class="ml-2 text-slate-400" id="searchIcon"></span>
        <input class="min-w-0 flex-1 bg-transparent px-2.5 outline-none" id="searchInput" placeholder="ស្វែងរកទំនិញដែលអ្នកចង់បាន..." type="search" />

        <div class="header-shortcuts">

  <main class="bottom-pad">
